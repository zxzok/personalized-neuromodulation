<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NSFC 62176129 | Personalized Neuromodulation</title>
  <script>
    // GitHub Pages SPA redirect: convert path to hash route
    // e.g. /personalized-neuromodulation/publications -> /#/publications
    (function () {
      var segmentCount = 1; // number of path segments to keep (repo name)
      var loc = window.location;
      var pathSegments = loc.pathname.split('/').filter(Boolean);
      // Remove the repo base segment
      var route = '/' + pathSegments.slice(segmentCount).join('/');
      if (route !== '/') {
        loc.replace(
          loc.protocol + '//' + loc.hostname + (loc.port ? ':' + loc.port : '') +
          '/' + pathSegments.slice(0, segmentCount).join('/') +
          '/#' + route +
          (loc.search || '')
        );
      } else {
        loc.replace(
          loc.protocol + '//' + loc.hostname + (loc.port ? ':' + loc.port : '') +
          '/' + pathSegments.slice(0, segmentCount).join('/') + '/'
        );
      }
    })();
  </script>
</head>

</body>
</html>
