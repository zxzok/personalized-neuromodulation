<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F2B46"/>
      <stop offset="100%" style="stop-color:#1A5276"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Brain network nodes -->
  <circle cx="900" cy="180" r="18" fill="#00B4D8" opacity="0.3"/>
  <circle cx="1000" cy="280" r="14" fill="#00B4D8" opacity="0.25"/>
  <circle cx="850" cy="350" r="20" fill="#00B4D8" opacity="0.2"/>
  <circle cx="1050" cy="150" r="12" fill="#00B4D8" opacity="0.2"/>
  <circle cx="950" cy="420" r="16" fill="#00B4D8" opacity="0.15"/>
  <circle cx="1100" cy="380" r="10" fill="#00B4D8" opacity="0.15"/>

  <!-- Network lines -->
  <line x1="900" y1="180" x2="1000" y2="280" stroke="#48CAE4" stroke-width="1" opacity="0.15"/>
  <line x1="1000" y1="280" x2="850" y2="350" stroke="#48CAE4" stroke-width="1" opacity="0.12"/>
  <line x1="900" y1="180" x2="1050" y2="150" stroke="#48CAE4" stroke-width="1" opacity="0.12"/>
  <line x1="850" y1="350" x2="950" y2="420" stroke="#48CAE4" stroke-width="1" opacity="0.1"/>
  <line x1="1000" y1="280" x2="1100" y2="380" stroke="#48CAE4" stroke-width="1" opacity="0.1"/>

  <!-- Accent line top -->
  <rect x="80" y="140" width="60" height="4" rx="2" fill="#00B4D8"/>

  <!-- Title -->
  <text x="80" y="200" font-family="Inter, system-ui, sans-serif" font-size="52" font-weight="700" fill="white">Personalized</text>
  <text x="80" y="265" font-family="Inter, system-ui, sans-serif" font-size="52" font-weight="700" fill="white">Neuromodulation</text>

  <!-- Subtitle -->
  <text x="80" y="320" font-family="Inter, system-ui, sans-serif" font-size="20" fill="#48CAE4" opacity="0.9">NSFC 62176129</text>

  <!-- Description -->
  <text x="80" y="380" font-family="Inter, system-ui, sans-serif" font-size="18" fill="white" opacity="0.6">Personalized Target Selection and Efficacy Evaluation</text>
  <text x="80" y="410" font-family="Inter, system-ui, sans-serif" font-size="18" fill="white" opacity="0.6">of Non-invasive Neuromodulation for Psychiatric Disorders</text>

  <!-- Institution -->
  <text x="80" y="480" font-family="Inter, system-ui, sans-serif" font-size="16" fill="white" opacity="0.4">Nanjing Medical University  |  PI: Xizhe Zhang</text>

  <!-- Bottom accent -->
  <rect x="0" y="620" width="1200" height="10" fill="#00B4D8" opacity="0.6"/>
</svg>
